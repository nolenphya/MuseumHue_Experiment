<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Map App</title>
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.css" rel="stylesheet" />
  <!-- Add missing CSS stylesheet link -->
  <link rel="stylesheet" href="styles.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; height: 100vh; overflow: hidden; }
    
    .app-container { display: flex; height: 100vh; width: 100vw; }
    .sidebar { width: 38%; height: 100%; overflow-y: auto; border-right: 1px solid #e0e0e0; background: #fff; z-index: 2; }
    .map-container { width: 62%; height: 100%; position: relative; }
    #map { width: 100%; height: 100%; }

    @media (max-width: 768px) {
      .app-container { flex-direction: column-reverse; }
      .sidebar { width: 100%; height: 45vh; }
      .map-container { width: 100%; height: 55vh; }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <aside class="sidebar" id="sidebar">
      <!-- List and Detail Views Render Here -->
    </aside>
    <main class="map-container">
      <div id="map"></div>
    </main>
  </div>

  <script>
    mapboxgl.accessToken = 'pk.eyJ1Ijoibm9sZW5waHlhIiwiYSI6ImNtOGk3bXB1MzBhM2Qyc292ZjZrZ2tjMHMifQ.ZItrPCguE2g3w99InSdzLQ';
    
    // Assign map instance to window.map so app.js can reference it
    window.map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/streets-v12',
      center: [-76.612, 39.290], // Adjusted map center to Baltimore test pins
      zoom: 13
    });

    window.map.easeTo({ padding: { left: 100 } });
  </script>

  <!-- Add missing JavaScript files -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
